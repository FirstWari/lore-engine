[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lore-engine"
version = "0.1.0"
description = "One-command lecture extractor for AI agents: video/PDF in, transcript + keyframes + storyboards out"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Slydite", email = "slydite@gmail.com"}
]
keywords = [
    "agent-skill",
    "education",
    "notes",
    "multimodal",
    "video-processing",
    "pdf",
    "transcripts"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "ImageHash>=4.3.2",
    "video-reader-rs>=0.2.10",
    "Pillow>=11.3.0",
    "pypdfium2>=4.30.0",
    "srt>=3.5.3",
    "python-dotenv>=1.1.1",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "black>=25.9.0",
]

[project.urls]
Homepage = "https://github.com/Slydite/lore-engine"
Repository = "https://github.com/Slydite/lore-engine"
Issues = "https://github.com/Slydite/lore-engine/issues"

[project.scripts]
lore = "lore:main"
lore-engine = "src.main:main"

[tool.setuptools]
packages = ["src", "src.core", "src.notes_generator", "src.notes_generator.processors"]
py-modules = ["lore"]

[tool.setuptools.package-data]
src = ["*.json"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests that test multiple components",
    "slow: Tests that take longer to run",
    "file_io: Tests that perform file I/O operations",
]

# Ruff configuration (modern Python linter/formatter)
[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "PTH123", # pathlib open() (optional)
]

[tool.ruff.per-file-ignores]
"tests/*" = ["B011"]  # Allow assert False in tests

# Black configuration (if you prefer Black over Ruff's formatter)
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

