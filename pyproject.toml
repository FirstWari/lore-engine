[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lore-engine"
version = "0.3.0"
description = "One command turns a lecture (URL, video or PDF) into transcript + keyframes + storyboards for an AI agent to read"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Slydite", email = "slydite@gmail.com"}]
keywords = ["education", "lecture", "notes", "transcript", "keyframes", "storyboard", "agent-skill", "yt-dlp", "coursera"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

dependencies = [
    "ImageHash>=4.3.2",
    "video-reader-rs>=0.2.10",
    "Pillow>=11.3.0",
    "pypdfium2>=4.30.0",
    "srt>=3.5.3",
    "python-dotenv>=1.1.1",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/Slydite/lore-engine"
Repository = "https://github.com/Slydite/lore-engine"
Issues = "https://github.com/Slydite/lore-engine/issues"

[project.scripts]
lore = "lore:main"

[tool.setuptools]
packages = ["lore_engine"]
py-modules = ["lore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q", "--tb=short"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
